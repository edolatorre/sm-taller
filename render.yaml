databases:
  - name: sm-taller-db
    plan: basic-256mb
    databaseName: sm_taller
    user: sm_taller

services:
  - type: web
    name: sm-taller
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma migrate deploy && npx prisma generate && npm run build
    startCommand: npm start
    disk:
      name: sm-taller-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: sm-taller-db
          property: connectionString
      - key: UPLOADS_DIR
        value: /var/data/uploads
